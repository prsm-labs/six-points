<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 2026-10-23 moved to degenlabs.app (user). An old address sends the visitor to https://nfl.degenlabs.app and carries this browser's
         saved data (My Picks, filters, settings: localStorage) along in the URL hash once, so nothing is lost; the new address
         reads it in, keeps anything it already has, and clears the hash. API routes (/api/...) on the old address keep working. -->
    <script>
      (function () {
        var OLD = {'nfl.thisisprism.app':1,'six-points.vercel.app':1}, TO = 'nfl.degenlabs.app', KEY = 'prism-migrate=';
        try {
          if (OLD[location.hostname]) {
            var d = {}, s = '', i, k;
            try { for (i = 0; i < localStorage.length; i++) { k = localStorage.key(i); d[k] = localStorage.getItem(k); } } catch (e) {}
            try { s = JSON.stringify(d); } catch (e) {}
            var hash = s && s.length > 2 && s.length < 60000 ? '#' + KEY + encodeURIComponent(s) : location.hash;
            location.replace('https://' + TO + location.pathname + location.search + hash);
            return;
          }
          var at = location.hash.indexOf(KEY);
          if (at === 1) {
            var o = JSON.parse(decodeURIComponent(location.hash.slice(1 + KEY.length)));
            for (var key in o) { try { if (localStorage.getItem(key) === null) localStorage.setItem(key, o[key]); } catch (e) {} }
            history.replaceState(null, '', location.pathname + location.search);
          }
        } catch (e) {}
      })();
    </script>
    <!-- 2026-10-23 new logo (DegenLabs App Logos canvas): tab icon switches with the browser theme (dark tile / accent tile) -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Six Points</title>
    <!-- 2026-10-23 link preview (Open Graph / Twitter): the PRISM Labs card for this app, 1200x630 (public/og.png) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="PRISM Labs" />
    <meta property="og:title" content="Six Points · NFL · PRISM Labs" />
    <meta property="og:description" content="Touchdown and yardage picks for every NFL week." />
    <meta property="og:url" content="https://nfl.degenlabs.app/" />
    <meta property="og:image" content="https://nfl.degenlabs.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Six Points — Touchdown and yardage picks for every NFL week." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Six Points · NFL · PRISM Labs" />
    <meta name="twitter:description" content="Touchdown and yardage picks for every NFL week." />
    <meta name="twitter:image" content="https://nfl.degenlabs.app/og.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
